    <style>
      :root {
        color-scheme: light;
        --bg: #fff5f9;
        --bg-soft: #ffeef6;
        --surface: #ffffff;
        --surface-border: #ffd3e6;
        --ink: #5c1a38;
        --ink-soft: #9c4a72;
        --pink: #ff5c9e;
        --pink-deep: #e83e8c;
        --pink-dark: #c2255c;
        --rose: #ff8fb8;
        --blush: #ffd9e9;
        --gold: #ffb84d;
        --shadow: 0 18px 40px rgba(232, 62, 140, 0.16);
        --btn-shadow: 0 14px 34px rgba(232, 62, 140, 0.45), 0 4px 10px rgba(232, 62, 140, 0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #22101b;
          --bg-soft: #2d1524;
          --surface: #351b2c;
          --surface-border: #5c2c47;
          --ink: #ffe3ef;
          --ink-soft: #f0a8c6;
          --pink: #ff6fae;
          --pink-deep: #ff4f9a;
          --pink-dark: #ff8fbe;
          --rose: #ff9ec4;
          --blush: #4a2438;
          --gold: #ffc46b;
          --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
          --btn-shadow: 0 14px 34px rgba(255, 79, 154, 0.35), 0 4px 10px rgba(0, 0, 0, 0.4);
        }
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Vazirmatn", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.8;
        overflow-x: hidden;
      }

      /* لایه‌ی ذرات شناور (قلب و ستاره) */
      #particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .particle {
        position: absolute;
        bottom: -40px;
        opacity: 0;
        animation: floatUp linear infinite;
      }
      .particle svg { display: block; }
      @keyframes floatUp {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.75; }
        85%  { opacity: 0.6; }
        100% { transform: translateY(-110vh) rotate(50deg); opacity: 0; }
      }

      /* صفحه دقیقاً یک نما است؛ بدون اسکرول عمودی */
      html, body { height: 100%; }
      body { overflow: hidden; }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 18px 20px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ---------- هدر / هیرو ---------- */
      .hero {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        min-height: 0;
      }

      /* فقط تصویر کوچک می‌شود تا بقیه‌ی محتوا همیشه کامل دیده شود */
      .hero > *:not(.hero-art) { flex: none; }

      .hero-art {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 3px solid var(--surface-border);
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      .hero-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-art::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(255, 245, 249, 0.35), transparent 45%);
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .hero-art::after { background: linear-gradient(to top, rgba(34, 16, 27, 0.35), transparent 45%); }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 18px;
        padding: 6px 16px;
        background: var(--bg-soft);
        border: 1.5px dashed var(--rose);
        border-radius: 999px;
        color: var(--pink-dark);
        font-size: 0.92rem;
        font-weight: 700;
      }
      .badge svg { flex: none; }

      h1 {
        margin: 14px 0 6px;
        font-size: clamp(2rem, 7.5vw, 3.4rem);
        font-weight: 900;
        line-height: 1.35;
        color: var(--ink);
      }
      h1 .accent { color: var(--pink-deep); }

      .hero-sub {
        margin: 0 auto;
        max-width: 560px;
        color: var(--ink-soft);
        font-size: clamp(1rem, 3.4vw, 1.15rem);
        font-weight: 500;
      }

      /* ---------- دکمه‌ی فانتزی تلگرام ---------- */
      .cta-zone { margin-top: 22px; }

      .tg-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        min-height: 64px;
        padding: 14px 30px 14px 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff7eb0 0%, var(--pink-deep) 55%, var(--pink-dark) 100%);
        color: #fff;
        text-decoration: none;
        font-family: inherit;
        font-size: clamp(1.1rem, 4vw, 1.3rem);
        font-weight: 800;
        box-shadow: var(--btn-shadow);
        overflow: visible;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .tg-btn:hover { transform: translateY(-3px) scale(1.02); }
      .tg-btn:active { transform: translateY(0) scale(0.98); }
      .tg-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

      /* برقِ روی دکمه */
      .tg-btn .shine {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        pointer-events: none;
      }
      .tg-btn .shine::before {
        content: "";
        position: absolute;
        top: -60%;
        bottom: -60%;
        width: 36%;
        left: -50%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: rotate(8deg);
        animation: shineSweep 3.2s ease-in-out infinite;
      }
      @keyframes shineSweep {
        0%, 55% { left: -50%; }
        85%, 100% { left: 130%; }
      }

      /* حلقه‌ی تپنده دور دکمه */
      .tg-btn::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 2.5px solid var(--pink);
        opacity: 0;
        animation: pulseRing 2.4s ease-out infinite;
        pointer-events: none;
      }
      @keyframes pulseRing {
        0% { transform: scale(1); opacity: 0.55; }
        70%, 100% { transform: scale(1.09, 1.22); opacity: 0; }
      }

      .tg-logo {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: inset 0 -3px 6px rgba(232, 62, 140, 0.18), 0 3px 8px rgba(0, 0, 0, 0.15);
      }
      .tg-logo svg { margin-right: 2px; }

      .tg-btn .sparkle {
        position: absolute;
        pointer-events: none;
        animation: twinkle 1.8s ease-in-out infinite;
      }
      .tg-btn .sparkle.s1 { top: -13px; inset-inline-start: 26px; }
      .tg-btn .sparkle.s2 { bottom: -11px; inset-inline-end: 44px; animation-delay: 0.6s; }
      .tg-btn .sparkle.s3 { top: -9px; inset-inline-end: 18px; animation-delay: 1.1s; }
      @keyframes twinkle {
        0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.5; }
        50% { transform: scale(1.15) rotate(25deg); opacity: 1; }
      }

      .cta-note {
        margin-top: 14px;
        color: var(--ink-soft);
        font-size: 0.95rem;
        font-weight: 500;
      }

      @media (prefers-reduced-motion: reduce) {
        .particle, .tg-btn .shine::before, .tg-btn::after, .tg-btn .sparkle { animation: none !important; }
        .tg-btn::after { display: none; }
        html { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <div id="particles" aria-hidden="true"></div>

    <div class="wrap">
      <!-- هیرو -->
